# 🎒 PORTABLE rig — per-station configuration. Copy to station.yml and edit.
#
#   cp config/station.portable.example.yml config/station.yml
#
# ⛔ station.yml is gitignored, and must stay that way. Feeder keys and upload
#    tokens are credentials, and a station position is a home address.
#
# ⚠️ This file is the seam that lets the rest of the repo be public. If you find
#    yourself hardcoding a position or a key anywhere else, put it here instead.
#
# ℹ️ There are two templates, one per rig. This is the one that goes out; the
#    other is station.stationary.example.yml. Pick by role and do not merge
#    them — the halves that do not apply are exactly what gets set by mistake.

station:
  # Free-form label used in logs. Not a secret, but it does identify a site.
  id: portable-01

  role: portable

# ⛔ THERE IS DELIBERATELY NO `position:` BLOCK HERE, AND ADDING ONE IS A BUG.
#    A rig that moves takes its position from gpsd, every session. A stale
#    hardcoded position on a rig that moves is worse than none: it produces a
#    complete, plausible, confidently wrong track rather than an obvious gap.
#    See BUILD.md §6a. 🏠 The stationary template has the block, because there
#    the position is a constant you survey once.

clock:
  # ⚠️ Refuse to record until the clock is disciplined. See BUILD.md §7 rule 4.
  #    An un-disciplined Pi clock silently corrupts every timestamp correlation
  #    made from the session, and it is cheap to check before starting.
  require_disciplined: true

  # ⛔ gps, and only gps. There is no network in the field to ask — that is the
  #    whole argument for carrying the puck. BUILD.md §6.
  source: gps

  # Fail the preflight if chrony reports an offset worse than this.
  # ℹ️ A USB GPS puck lands around ±100 ms, so 500 is a fault bar, not a target.
  max_offset_ms: 500

dongles:
  # ⛔ Set unique EEPROM serials or USB enumeration order will shuffle at boot
  #    and the decoder will grab the wrong radio — RADIOS.md §5, rule 2.
  #      rtl_eeprom -d 0 -s 1090
  adsb: "1090"

  # 🎒 Second radio on a portable rig is AIRBAND (rtl_airband) — RADIOS.md §3.
  #    Null if you are running a single-dongle rig, which you should be until
  #    the base rig is boring (BUILD.md §8 step 5).
  # ⛔ Two dongles plus the GPS puck needs a powered hub — BUILD.md §3d part 14.
  vhf: null

uploader:
  # ⛔ THIS DOES NOT UPLOAD IN THE FIELD. There is no network out there. It
  #    spools batches to disk for the whole session and ships them the next
  #    time the rig sees a network — BUILD.md §7 rule 3.
  #
  # Null endpoint means log locally only, and never ship. That is a valid rig.
  endpoint: null
  token: null                 # ⛔ a credential; keep it out of the repo
  batch_seconds: 10

  # ⚠️ Sized for a whole session, not for a retry window — nothing drains this
  #    until you are home. Put it somewhere with room.
  spool_dir: /var/lib/adsb-receiver/spool
