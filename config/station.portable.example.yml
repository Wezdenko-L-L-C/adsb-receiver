# 🎒 PORTABLE rig — per-station configuration. Copy to station.yml and edit.
#
#   cp config/station.portable.example.yml config/station.yml
#
# ⛔ station.yml is gitignored, and must stay that way. Feeder keys and upload
#    tokens are credentials, and a station position is a home address.
#
# ⚠️ This file is the seam that lets the rest of the repo be public. If you find
#    yourself hardcoding a position or a key anywhere else, put it here instead.
#
# ℹ️ There are two templates, one per rig. This is the one that goes out; the
#    other is station.stationary.example.yml. Pick by role and do not merge
#    them — the halves that do not apply are exactly what gets set by mistake.

station:
  # Free-form label used in logs. Not a secret, but it does identify a site.
  id: portable-01

  role: portable

# ⛔ THERE IS DELIBERATELY NO `position:` BLOCK HERE, AND ADDING ONE IS A BUG.
#    A rig that moves takes its position from gpsd, every session. A stale
#    hardcoded position on a rig that moves is worse than none: it produces a
#    complete, plausible, confidently wrong track rather than an obvious gap.
#    See BUILD.md §6a. 🏠 The stationary template has the block, because there
#    the position is a constant you survey once.

clock:
  # ⚠️ Refuse to record until the clock is disciplined. See BUILD.md §7 rule 4.
  #    An un-disciplined Pi clock silently corrupts every timestamp correlation
  #    made from the session, and it is cheap to check before starting.
  require_disciplined: true

  # ⛔ gps, and only gps. There is no network in the field to ask — that is the
  #    whole argument for carrying the puck. BUILD.md §6.
  source: gps

  # Fail the preflight if chrony reports an offset worse than this.
  # ℹ️ A USB GPS puck lands around ±100 ms, so 500 is a fault bar, not a target.
  max_offset_ms: 500

dongles:
  # ⛔ Set unique EEPROM serials or USB enumeration order will shuffle at boot
  #    and the decoder will grab the wrong radio — RADIOS.md §5, rule 2.
  #      rtl_eeprom -d 0 -s 1090
  adsb: "1090"

  # 🎒 Second radio on a portable rig is AIRBAND (rtl_airband) — RADIOS.md §3.
  #    Null if you are running a single-dongle rig, which you should be until
  #    the base rig is boring (BUILD.md §8 step 5).
  # ⛔ Two dongles plus the GPS puck needs a powered hub — BUILD.md §3d part 14.
  vhf: null

archive:
  # 🎒 The archive drive: a USB flash drive, formatted ext4 once, and found by
  #    this label. No step formats it: setup/steps/30-archive-drive.sh prints
  #    the commands when no ext4 filesystem carries the label. Only the first
  #    build's bootstrap may format it (setup/foundation/format-archive.sh),
  #    and only when exactly one removable USB drive of at least 8 GB
  #    qualifies: one with no filesystem, or whose single partition holds only
  #    an empty FAT, exFAT, NTFS or ext filesystem, as a new stick does (that
  #    filesystem is erased). A drive already carrying this label is never
  #    formatted automatically: step 30 mounts it if it is ext4; if it is not,
  #    the bootstrap refuses and step 30 stops, naming the fix (format that
  #    device as ext4 by hand if it may be erased; otherwise unplug it or
  #    remove its label). The bootstrap's --no-format turns formatting off.
  #    Otherwise it is formatted by hand. A spare drive formatted ext4 with the
  #    same label works with no edit here. PLAN §9m.
  # ⚠️ ext4 caps a label at 16 bytes. Letters, digits, - and _ only.
  label: adsb-archive

  # ⛔ BEAST, not a bespoke format — BUILD.md §9. There is no `format:` key:
  #    the archive writer (bin/adsb-writer, PLAN §9m) writes BEAST and nothing
  #    else.

  # A backstop, not a budget, in GiB (2^30 bytes; the writer counts it so).
  # ~10 MB an hour is an estimate (PLAN §9m), not a measurement. Corrected
  # 2026-10-10: measured on 2026-10-04 at about 9 MB an hour, on the writer's
  # first closed file on the portable (PLAN §9m). Below this
  # much free space the archive writer expires the oldest closed files, but
  # only if deleting every closed file would bring it back above this;
  # otherwise it deletes nothing and refuses to record (bin/adsb-writer,
  # "SPACE"). The preflight warns.
  min_free_gb: 4

  # ℹ️ There is deliberately no `retention_days` on this rig. The pull moves the
  #    data off the drive (PLAN §9m), and the min_free_gb backstop above is the
  #    only other deletion.

uploader:
  # ⛔ THIS DOES NOT UPLOAD IN THE FIELD. There is no network out there. It
  #    spools batches to disk for the whole session and ships them the next
  #    time the rig sees a network — BUILD.md §7 rule 3.
  #
  # Corrected 2026-10-10: the uploader is not written, and nothing reads this
  #    block yet (BUILD.md §7). Both rigs get one (Chris, 2026-10-10, PLAN
  #    §9i), built and first proven on this rig at home. Its design is issue
  #    #1, and the keys below may change with it. Until it lands, the data is
  #    moved off by tools/pull-archive (PLAN §9m).
  #
  # Null endpoint means log locally only, and never ship. That is a valid rig.
  # Corrected 2026-10-10: on this rig null is interim, until the uploader.
  #    Whether it stays a valid setting after that is for the uploader's
  #    design, and is not ruled (BUILD.md §7, PLAN §9i).
  endpoint: null
  # ⚠️ Not decided: what credential a rig holds is not ruled (PLAN §9i), and the
  #    design PLAN §9i records as a recommendation, not a ruling, delivers no
  #    secret to a rig. The field is kept until the uploader's design (issue
  #    #1); it may change or go there.
  token: null                 # ⛔ a credential; keep it out of the repo
  batch_seconds: 10

  # ⚠️ Sized for a whole session, not for a retry window — nothing drains this
  #    until you are home. It is on the archive drive (PLAN §9m), not the SD
  #    card: the drive has the room, and it is the one place to pull from.
  spool_dir: /var/lib/adsb-receiver/archive/spool

update:
  # 🎒 The home-gated window opener (PLAN §9f): at home, and only when an update
  #    is pending, it opens the pull window, which ends the recording session,
  #    updates the rig, and starts recording again. It runs about 4 minutes
  #    after boot and once a day (setup/steps/70-portable-home-update.sh).
  #    "At home" means the active Wi-Fi network's name (SSID) is this one.
  # ⭐ Unset or empty means the opener is OFF: it is opt-in. Then a recording rig
  #    updates only in a pull window opened by hand (tools/pull-archive).
  # ➡️ Set it by hand, on the rig, in the installed copy:
  #      sudo nano /etc/adsb-receiver/station.yml
  #    The opener reads that file at each check, so no step needs to run after.
  # ⛔ The opener and its check (bin/adsb-at-home) never print or log it: they
  #    say only "at home", "not at home", "off" or "cannot tell", and nothing
  #    writes it into status.json.
  # ⚠️ Quote it ("..."), as a string: an unquoted yes, no, on or off is YAML's
  #    true or false, and a number is a number; the opener treats anything but
  #    a string as unset, and step 70's verify refuses it. A hotspot with the
  #    same name counts as home (PLAN §9f: one bounded gap, fixed by renaming
  #    the hotspot).
  home_ssid: ""
