# 🏠 STATIONARY rig — per-station configuration. Copy to station.yml and edit.
#
#   cp config/station.stationary.example.yml config/station.yml
#
# ⛔ station.yml is gitignored, and must stay that way. A stationary receiver's
#    coordinates are a home address — yours, or a friend's if the antenna is on
#    their roof. Feeder keys are credentials. Neither belongs in a public repo.
#
# ⚠️ This file is the seam that lets the rest of the repo be public. If you find
#    yourself hardcoding a position or a key anywhere else, put it here instead.
#
# ℹ️ There are two templates, one per rig. This is the one that stays put; the
#    other is station.portable.example.yml. Pick by role and do not merge them
#    — the halves that do not apply are exactly what gets set by mistake.

station:
  # Free-form label used in logs. Not a secret, but it does identify a site.
  id: home-01

  role: stationary

position:
  # ✅ Survey it once, to a few meters, and leave it alone: the decoder needs it
  #    to resolve surface positions properly. On a rig that never moves this is
  #    a constant, which is why there is no GPS puck in the parts list.
  #
  # ⛔ If the antenna is on somebody else's roof, this is THEIR home address. It
  #    lands in your data and, through the archive, in anything you publish from
  #    it. Agree the siting before the antenna goes up — BUILD.md §2.
  latitude: null
  longitude: null
  altitude_m: null            # antenna height above sea level, not above ground

clock:
  # ⚠️ Refuse to record until the clock is disciplined. See BUILD.md §7 rule 4.
  require_disciplined: true

  # ⛔ ntp, and only ntp. Plain chrony — no gpsd, no RTC. At a house there is a
  #    network, and NTP over it beats a USB puck. BUILD.md §2.
  source: ntp

  # Fail the preflight if chrony's error bound is worse than this.
  # ⚠️ NTP over a working network gives ~1–10 ms.
  # Corrected 2026-11-22: 500, not 100, by A3 of #33 (PLAN §9h, 2026-11-14):
  #    the preflight compares chrony's whole error bound, half the root delay
  #    included, so a stall at 100 refuses a writer restart within hours; at
  #    500 it has days. Ill health shows in the clock's state word instead.
  max_offset_ms: 500

dongles:
  # ⛔ Set unique EEPROM serials or USB enumeration order will shuffle at boot
  #    and the decoder will grab the wrong radio — RADIOS.md §5, rule 2.
  #      rtl_eeprom -d 0 -s 1090
  adsb: "1090"

  # 🏠 Second radio on a stationary rig is VDL2 (dumpvdl2) — RADIOS.md §4.
  #    Null until the base rig is boring (BUILD.md §8 step 5).
  vhf: null

archive:
  # ℹ️ Both rigs archive (PLAN §9m). ⛔ Do not run it onto the SD card.
  # ⚠️ Planned: no code reads `enabled` yet, so setting it changes nothing.
  enabled: false
  # The archive lives at /var/lib/adsb-receiver/archive, a fixed interface path
  # (PLAN §9i), not a key. What backs that path on this rig, its boot SSD or a
  # separate mount, is not decided (PLAN §9m).
  # ⛔ Not a bespoke format — BUILD.md §9. ⚠️ Planned: no code reads `format`
  #    yet; the archive writer (bin/adsb-writer) writes BEAST and nothing else.
  format: beast

  # Added 2026-11-22: the ext4 label of the archive's filesystem, which step 30
  #    mounts at /var/lib/adsb-receiver/archive, the same as the 🎒 portable's
  #    (PLAN §9m). On the stand-in home stationary (a Pi 4, PLAN §9i's
  #    2026-11-22 update) it is a USB drive; on the Pi 5 it is the NVMe's
  #    separate adsb-archive partition (A5 of #33, PLAN §9h). On a first build
  #    the bootstrap formats a new, empty USB drive with it when exactly one
  #    qualifies (setup/foundation/format-archive.sh); otherwise step 30
  #    prints the command.
  # ⚠️ ext4 caps a label at 16 bytes. Letters, digits, - and _ only.
  label: adsb-archive

  # ⚠️ Retention is planned, not enforced: no code reads `retention_days` yet.
  #    Enforcing it in the writer, not in a cron job somebody forgets, is
  #    issue #2. An unbounded archive fills the disk and then stops recording,
  #    which is the one failure that costs you the data.
  # What protects the disk today is min_free_gb alone, the writer's backstop,
  #    in GiB: below it, the writer expires the oldest closed files, but only
  #    if deleting every closed file would bring free space back above it;
  #    otherwise it deletes nothing and refuses to record (bin/adsb-writer,
  #    "SPACE"). The preflight warns.
  retention_days: 365
  min_free_gb: 20             # start expiring early rather than hitting zero

feeders:
  # ⚠️ Planned: no code reads this block yet, and no feeder client is
  #    installed by any step.
  # ⛔ Credentials — never commit real values.
  # ℹ️ Feeding usually earns a better API allowance than registering alone, and
  #    it is the rent for a public good this kind of project leans on.
  opensky:
    enabled: false
    username: null
    serial: null
  airframes:                  # VDL2/ACARS — see RADIOS.md §4
    enabled: false
    station_id: null

uploader:
  # Added 2026-11-22: the uploader lands (issue #1; PLAN §9i's 2026-11-22
  #    update), and this block replaces the refusal that stood here: "THERE IS
  #    DELIBERATELY NO `uploader:` BLOCK HERE", which held until the change that
  #    lands the uploader.
  # What it does: every 10 minutes, setup/steps/45-uploader.sh's timer runs
  #    bin/adsb-uploader, which copies the writer's closed files to the
  #    archive's off-site store under the mirror rule
  #    (<store>/<this rig's hostname>/beast/YYYY-MM-DD/<file>, PLAN §9m), checks
  #    each one's size and MD5 against the store's, and deletes the local copy
  #    only when both match. The rig's hostname is its one name (A8 of #33).
  # ⭐ false: nothing uploads, the timer is stopped, and the archive stays on
  #    the drive. That is a valid rig.
  enabled: false
  # The store is a Google Drive shared drive, reached by rclone as a service
  #    account that is a member of that drive only (Chris, 2026-11-22).
  # ⛔ This repo never names the store (PLAN §9m, B). The ID goes here, in the
  #    installed copy, which is gitignored and root-only. It is the last part
  #    of the shared drive's URL: drive.google.com/drive/folders/<this>.
  shared_drive_id: null
  # A folder path inside the shared drive that stands for the store's root,
  #    or "" for its top level, where the 🎒 portable's host folder already is.
  root_folder: ""
  # ⛔ The credential is NOT a key here. It is a file the step reads, put on the
  #    rig by hand, root:root 0600: /etc/adsb-receiver/uploader-sa.json, the
  #    service account's JSON key. BUILD.md §8 step 4b says how.
