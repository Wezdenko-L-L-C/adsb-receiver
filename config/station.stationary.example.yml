# 🏠 STATIONARY rig — per-station configuration. Copy to station.yml and edit.
#
#   cp config/station.stationary.example.yml config/station.yml
#
# ⛔ station.yml is gitignored, and must stay that way. A stationary receiver's
#    coordinates are a home address — yours, or a friend's if the antenna is on
#    their roof. Feeder keys are credentials. Neither belongs in a public repo.
#
# ⚠️ This file is the seam that lets the rest of the repo be public. If you find
#    yourself hardcoding a position or a key anywhere else, put it here instead.
#
# ℹ️ There are two templates, one per rig. This is the one that stays put; the
#    other is station.portable.example.yml. Pick by role and do not merge them
#    — the halves that do not apply are exactly what gets set by mistake.

station:
  # Free-form label used in logs. Not a secret, but it does identify a site.
  id: home-01

  role: stationary

position:
  # ✅ Survey it once, to a few meters, and leave it alone: the decoder needs it
  #    to resolve surface positions properly. On a rig that never moves this is
  #    a constant, which is why there is no GPS puck in the parts list.
  #
  # ⛔ If the antenna is on somebody else's roof, this is THEIR home address. It
  #    lands in your data and, through the archive, in anything you publish from
  #    it. Agree the siting before the antenna goes up — BUILD.md §2.
  latitude: null
  longitude: null
  altitude_m: null            # antenna height above sea level, not above ground

clock:
  # ⚠️ Refuse to record until the clock is disciplined. See BUILD.md §7 rule 4.
  require_disciplined: true

  # ⛔ ntp, and only ntp. Plain chrony — no gpsd, no RTC. At a house there is a
  #    network, and NTP over it beats a USB puck. BUILD.md §2.
  source: ntp

  # Fail the preflight if chrony reports an offset worse than this.
  # ⚠️ NTP over a working network gives ~1–10 ms. A loose bar here would hide a
  #    real fault — if this trips, chrony is not actually syncing.
  max_offset_ms: 100

dongles:
  # ⛔ Set unique EEPROM serials or USB enumeration order will shuffle at boot
  #    and the decoder will grab the wrong radio — RADIOS.md §5, rule 2.
  #      rtl_eeprom -d 0 -s 1090
  adsb: "1090"

  # 🏠 Second radio on a stationary rig is VDL2 (dumpvdl2) — RADIOS.md §4.
  #    Null until the base rig is boring (BUILD.md §8 step 5).
  vhf: null

archive:
  # ⛔ This is why the stationary rig exists. Do not run it onto the SD card.
  enabled: false
  # The archive lives at /var/lib/adsb-receiver/archive, a fixed interface path
  # (PLAN §9i), not a key. What backs that path on this rig, its boot SSD or a
  # separate mount, is not decided (PLAN §9m).
  format: beast               # ⛔ not a bespoke format — BUILD.md §9

  # ⛔ Retention is enforced HERE, by the writer, not by a cron job somebody
  #    forgets. An unbounded archive fills the disk and then silently stops
  #    recording, which is the one failure that costs you the data.
  retention_days: 365
  min_free_gb: 20             # start expiring early rather than hitting zero

feeders:
  # ⛔ Credentials — never commit real values.
  # ℹ️ Feeding usually earns a better API allowance than registering alone, and
  #    it is the rent for a public good this kind of project leans on.
  opensky:
    enabled: false
    username: null
    serial: null
  airframes:                  # VDL2/ACARS — see RADIOS.md §4
    enabled: false
    station_id: null

# ⛔ THERE IS DELIBERATELY NO `uploader:` BLOCK HERE. On this rig the archive
#    and the feeder clients are the equivalent, and they are above. A rig with a
#    permanent network does not need to spool for a trip home. See BUILD.md §7.
